services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: limen-api:local
    container_name: limen-app
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: ${PORT:-8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-limen}:${POSTGRES_PASSWORD:-limen}@postgres:5432/${POSTGRES_DB:-limen}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

