  #     - app

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app
    restart: always

volumes:
  # postgres_data:
  redis_data:
  tempo_data:
  loki_data:
  grafana_data:

networks:
  app:
    driver: bridge
