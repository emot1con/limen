services:
  app:
    container_name: app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    restart: always
    networks:
      - app

  # postgres:
  #   container_name: postgres
  #   image: postgres:15.15-trixie
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     POSTGRES_DB: ${POSTGRES_DB}
  #   ports:
  #     - "5432:5432"
  #   env_file:
  #     - .env
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5
  #   restart: always
  #   networks:
  #     - app

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app
    restart: always

  migrate:
    image: migrate/migrate
    container_name: migrate
    user: root
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    volumes:
      - ./migrations:/migrations:Z
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable",
        "up",
      ]
    env_file:
      - .env
    restart: "no"
    networks:
      - app

volumes:
  # postgres_data:
  redis_data:

networks:
  app:
    driver: bridge