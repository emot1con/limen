services:
  app:
    container_name: app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    depends_on:
      - tempo
      - loki
    restart: always
    networks:
      - app

  # postgres:
  #   container_name: postgres
  #   image: postgres:15.15-trixie
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     POSTGRES_DB: ${POSTGRES_DB}
  #   ports:
  #     - "5432:5432"
  #   env_file:
  #     - .env
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5
  #   restart: always
  #   networks:
  #     - app

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app
    restart: always

  tempo:
    image: grafana/tempo:2.7.0
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro,z
      - tempo_data:/var/tempo:z
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "3200:3200" # Tempo UI / API
    networks:
      - app
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    volumes:
      - ./deploy/observability/loki.yaml:/etc/loki/local-config.yaml:ro,z
      - loki_data:/loki:z
    ports:
      - "3100:3100"
    networks:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro,z
      - grafana_data:/var/lib/grafana:z
    networks:
      - app
    restart: unless-stopped

volumes:
  # postgres_data:
  redis_data:
  tempo_data:
  loki_data:
  grafana_data:

networks:
  app:
    driver: bridge
