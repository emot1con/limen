services:
  app:
    image: numpyh/limen:v1
    container_name: app
    env_file: .env
    environment:
      APP_ENV: production
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
    restart: unless-stopped
    networks: [app]
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:15.15-trixie
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [app]
    logging: *logging

  redis:
    image: redis:8.4-alpine   # cek tag di Docker Hub, pakai versi yang sudah kamu tes
    container_name: redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks: [app]
    logging: *logging

  tempo:
    image: grafana/tempo:2.7.0
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro,z
      - tempo_data:/var/tempo:z
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:3200:3200"
    restart: unless-stopped
    networks: [app]
    logging: *logging

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./deploy/observability/loki.yaml:/etc/loki/local-config.yaml:ro,z
      - loki_data:/loki:z
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped
    networks: [app]
    logging: *logging

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro,z
      - grafana_data:/var/lib/grafana:z
    restart: unless-stopped
    networks: [app]
    logging: *logging

volumes:
  postgres_data:
  redis_data:
  tempo_data:
  loki_data:
  grafana_data:

networks:
  app: