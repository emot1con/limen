openapi: 3.0.3
info:
  title: LIMEN API
  version: 0.1.0-proposed
  description: >
    Draft kontrak REST API LIMEN (Sistem Absensi Terintegrasi), Fase E.
    Seluruh endpoint berstatus Proposed dan belum diimplementasikan.
    Dokumen sumber naratif: docs/06-api-documentation.md.
  contact:
    name: Tim LIMEN
  license:
    name: Proprietary
servers:
  - url: /api/v1
    description: Base path versi 1 (usulan)
tags:
  - name: Auth
    description: Autentikasi sesi pengguna (login, logout, profil sesi).
  - name: Attendance
    description: Absensi kelas (guru mapel) dan absensi harian (guru wali).
  - name: Settings
    description: Pengaturan sekolah (jam absensi, toleransi, dsb).
  - name: Devices
    description: Manajemen perangkat absensi dan penerimaan event perangkat.
  - name: Users
    description: Manajemen akun pengguna, peran, dan profil.
  - name: Academic
    description: Data akademik (tahun ajaran, kelas, mata pelajaran, siswa, guru).
  - name: Schedules
    description: Jadwal pelajaran.
  - name: Quiz
    description: Pengerjaan kuis/latihan oleh siswa.
  - name: QuestionBanks
    description: Bank soal dan soal.
  - name: Assignments
    description: Penugasan/tugas.
  - name: Assessments
    description: Penilaian dan nilai.
  - name: Reports
    description: Laporan dan ekspor.
  - name: Counseling
    description: Bimbingan konseling.
  - name: Aptitude
    description: Tes minat bakat (MB) dan psikotes (PG).
  - name: Notifications
    description: Notifikasi pengguna.
  - name: Fingerprint
    description: >
      Gateway biometrik legacy (eks-Express) yang digabung ke API utama tanpa
      autentikasi. Endpoint tersedia di root (/fingerprint/*), bukan di bawah
      /api/v1, agar tetap kompatibel dengan perangkat ESP32 dan klien lama.
security:
  - sessionCookie: []
paths:
  /auth/login:
    post:
      operationId: API-AUTH-001
      tags: [Auth]
      summary: Login email + password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1 }
      responses:
        '200':
          description: Sesi dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/UserSummary' }
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      operationId: API-AUTH-002
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Auth]
      summary: Akhiri sesi
      responses:
        '204': { description: Sesi dicabut }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/me:
    get:
      operationId: API-AUTH-003
      tags: [Auth]
      summary: Identitas & peran sesi aktif
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /users:
    get:
      operationId: API-USR-001
      tags: [Users]
      summary: Daftar pengguna
      parameters:
        - { name: role, in: query, schema: { $ref: '#/components/schemas/RoleCode' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/UserStatus' } }
        - { name: q, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/UserSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: API-USR-002
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Users]
      summary: Buat pengguna
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, password, roles]
              properties:
                fullName: { type: string }
                email: { type: string, format: email }
                password: { type: string }
                roles:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/RoleCode' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: API-USR-003
      tags: [Users]
      summary: Detail pengguna
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: API-USR-004
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Users]
      summary: Ubah peran/status pengguna
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string }
                status: { $ref: '#/components/schemas/UserStatus' }
                roles:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/RoleCode' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/{userId}/password-reset:
    post:
      operationId: API-AUTH-004
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Auth, Users]
      summary: Admin reset password pengguna
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword: { type: string }
      responses:
        '204': { description: Password direset; sesi dicabut }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /attendance/ingest:
    post:
      operationId: API-ABS-001
      tags: [Attendance]
      summary: Terima event absensi dari perangkat
      security:
        - deviceId: []
          deviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, identifier, timestamp, eventType]
              properties:
                deviceId: { type: string, format: uuid }
                identifier: { type: string }
                timestamp: { type: string, format: date-time }
                eventType: { $ref: '#/components/schemas/AttendanceEventType' }
      responses:
        '200':
          description: Diterima (termasuk duplicate = no-op)
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: boolean }
                  duplicate: { type: boolean }
                  eventId: { type: integer, format: int64 }
                  matched: { type: boolean }
                  subjectType: { $ref: '#/components/schemas/SubjectType' }
                  subjectUserId: { type: string, format: uuid, nullable: true }
                  attendanceRecordId: { type: string, format: uuid, nullable: true }
                  attendanceDate: { type: string, format: date }
                  resultingStatus: { $ref: '#/components/schemas/AttendanceStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidDeviceCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /attendance/records:
    get:
      operationId: API-ABS-002
      tags: [Attendance]
      summary: Daftar/rekap harian absensi
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: dateFrom, in: query, schema: { type: string, format: date } }
        - { name: dateTo, in: query, schema: { type: string, format: date } }
        - { name: classId, in: query, schema: { type: string, format: uuid } }
        - { name: subjectUserId, in: query, schema: { type: string, format: uuid } }
        - { name: subjectType, in: query, schema: { $ref: '#/components/schemas/SubjectType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AttendanceStatus' } }
        - { name: source, in: query, schema: { $ref: '#/components/schemas/AttendanceSource' } }
        - { name: sort, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AttendanceRecord' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /attendance/records/{recordId}:
    get:
      operationId: API-ABS-003
      tags: [Attendance]
      summary: Detail satu rekaman harian
      parameters:
        - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRecordDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /attendance/records/{subjectUserId}/{date}:
    put:
      operationId: API-ABS-004
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Attendance]
      summary: Guru menetapkan status belum tercatat (upsert)
      parameters:
        - { name: subjectUserId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/AttendanceStatus' }
                note: { type: string }
      responses:
        '200':
          description: Tersimpan (baru/ubah)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRecord' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /attendance/corrections:
    get:
      operationId: API-ABS-006
      tags: [Attendance]
      summary: Daftar koreksi
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CorrectionStatus' } }
        - { name: attendanceRecordId, in: query, schema: { type: string, format: uuid } }
        - { name: requestedBy, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Correction' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: API-ABS-005
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Attendance]
      summary: Ajukan koreksi absensi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attendanceRecordId, newStatus, reason]
              properties:
                attendanceRecordId: { type: string, format: uuid }
                newStatus: { $ref: '#/components/schemas/AttendanceStatus' }
                reason: { type: string }
      responses:
        '201':
          description: Diajukan (pending)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Correction' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /attendance/corrections/{correctionId}/approve:
    post:
      operationId: API-ABS-007
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Attendance]
      summary: Setujui koreksi
      parameters:
        - { name: correctionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reviewNote: { type: string }
      responses:
        '200':
          description: Disetujui; rekap resmi berubah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Correction' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /attendance/corrections/{correctionId}/reject:
    post:
      operationId: API-ABS-008
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Attendance]
      summary: Tolak koreksi
      parameters:
        - { name: correctionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewNote]
              properties:
                reviewNote: { type: string }
      responses:
        '200':
          description: Ditolak
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Correction' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /settings/school:
    get:
      operationId: API-SET-001
      tags: [Settings]
      summary: Baca pengaturan sekolah
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolSettings' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    put:
      operationId: API-SET-002
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Settings]
      summary: Ubah jam masuk pertama
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstEntryTime]
              properties:
                firstEntryTime:
                  type: string
                  pattern: '^([01]\d|2[0-3]):[0-5]\d$'
                  example: '07:15'
                lateToleranceMinutes: { type: integer, minimum: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolSettings' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /devices:
    get:
      operationId: API-DEV-001
      tags: [Devices]
      summary: Daftar alat absensi
      parameters:
        - { name: isActive, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: API-DEV-002
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Devices]
      summary: Registrasi alat absensi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                location: { type: string }
                serial: { type: string }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /devices/{deviceId}:
    parameters:
      - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: API-DEV-003
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Devices]
      summary: Ubah data/status alat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                location: { type: string }
                isActive: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /classes:
    get:
      operationId: API-MST-001
      tags: [Academic]
      summary: Daftar kelas
      parameters:
        - { name: level, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Class' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      operationId: API-MST-002
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Academic]
      summary: Buat kelas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                level: { type: string }
                homeroomTeacherUserId: { type: string, format: uuid }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Class' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /classes/{classId}:
    parameters:
      - { name: classId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: API-MST-003
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Academic]
      summary: Ubah kelas/wali kelas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                level: { type: string }
                homeroomTeacherUserId: { type: string, format: uuid, nullable: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Class' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /subjects:
    get:
      operationId: API-MST-004
      tags: [Academic]
      summary: Daftar mata pelajaran
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Subject' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      operationId: API-MST-005
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Academic]
      summary: Buat mata pelajaran
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subject' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /students:
    get:
      operationId: API-MST-006
      tags: [Academic]
      summary: Daftar siswa
      parameters:
        - { name: classId, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string } }
