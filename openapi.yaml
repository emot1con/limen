  # --- Legacy Express gateway (tanpa auth, base path /api) ---
  /fingerprint/identify:
    post:
      operationId: API-FP-001
      tags: [Fingerprint]
      summary: Identifikasi sidik jari dari capture mentah
      description: >
        Menerima capture R503 tepat 18432 byte (application/octet-stream),
        meneruskannya ke fingerprint service, dan memperkaya hasil yang matched
        dengan fullName/email dari database aplikasi.
      servers:
        - url: /
      security: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Capture R503, tepat 18432 byte.
      responses:
        '200':
          description: Hasil identifikasi dari fingerprint service
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FingerprintIdentifyResult' }
        '400':
          description: Body bukan binary atau ukuran tidak 18432 byte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayError' }
        '413':
          description: Body melebihi 64 KB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayError' }
        '500':
          description: Fingerprint service tidak dapat dijangkau
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayError' }
  /fingerprint/enroll:
    post:
      operationId: API-FP-002
      tags: [Fingerprint]
      summary: Enrollment template (JSON base64)
      servers:
        - url: /
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [externalUserId, template]
              properties:
                externalUserId: { type: string, format: uuid }
                template: { type: string, description: Template sidik jari (base64). }
      responses:
        '200':
          description: Hasil enrollment dari fingerprint service
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400':
          description: externalUserId/template kosong
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayError' }
        '500':
          description: Fingerprint service tidak dapat dijangkau
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayError' }
  /fingerprint/enroll/raw:
    post:
      operationId: API-FP-003
      tags: [Fingerprint]
      summary: Enrollment dari capture mentah
      servers:
        - url: /
      security: []
      parameters:
        - { name: externalUserId, in: query, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Capture R503, tepat 18432 byte.
      responses:
        '200':
          description: Hasil enrollment dari fingerprint service
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400':
          description: externalUserId kosong, body bukan binary, atau ukuran salah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayError' }
        '413':
          description: Body melebihi 64 KB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayError' }
        '500':
          description: Fingerprint service tidak dapat dijangkau
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GatewayError' }
  /fingerprint/latest:
    get:
      operationId: API-FP-004
      tags: [Fingerprint]
      summary: Hasil identifikasi terakhir
      description: >
        Mengembalikan hasil terakhir dari memori; setelah restart fallback ke
        baris terakhir tabel identifications. data bernilai null bila belum ada.
      servers:
        - url: /
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FingerprintLatestResponse' }
  /fingerprint/stream:
    get:
      operationId: API-FP-005
      tags: [Fingerprint]
      summary: SSE stream hasil identifikasi
      description: >
        Server-Sent Events. Mengirim event terakhir segera bila ada, lalu event
        baru setiap identifikasi selesai. Komentar : connected dan : keepalive
        bukan event data. Keepalive setiap 25 detik.
      servers:
        - url: /
      security: []
      responses:
        '200':
          description: Stream event
          content:
            text/event-stream:
              schema:
                type: string
                description: 'Format: data: <json>\n\n'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: limen_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
    deviceId:
      type: apiKey
      in: header
      name: X-Device-Id
    deviceKey:
      type: apiKey
      in: header
      name: X-Device-Key
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    BadRequest:
      description: Permintaan tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: Sesi tidak ada/kedaluwarsa
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidCredentials:
      description: Kredensial salah
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidDeviceCredentials:
      description: Kredensial perangkat salah
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Tidak memiliki hak akses
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Konflik state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Validasi gagal
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Terlalu banyak permintaan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string }
        details:
          type: object
          properties:
            fields:
              type: array
              items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      properties:
        field: { type: string }
        message: { type: string }
    PageMeta:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer, format: int64 }
    RoleCode:
      type: string
      enum: [siswa, guru_mapel, guru_wali, guru_bk, admin]
    UserStatus:
      type: string
      enum: [active, inactive]
    AttendanceStatus:
      type: string
      enum: [hadir, terlambat, izin, sakit, alpa]
    AttendanceSource:
      type: string
      enum: [device, manual, correction]
    AttendanceEventType:
      type: string
      enum: [check_in, check_out]
    SubjectType:
      type: string
      enum: [student, teacher]
    CorrectionStatus:
      type: string
      enum: [pending, approved, rejected]
    ScheduleKind:
      type: string
      enum: [pelajaran, ujian, tryout]
    QuestionType:
      type: string
      enum: [pilihan_ganda, pilihan_ganda_kompleks, benar_salah, rentang_nilai, essay]
    UserSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        roles:
          type: array
          items: { $ref: '#/components/schemas/RoleCode' }
        status: { $ref: '#/components/schemas/UserStatus' }
    UserDetail:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          properties:
            profile:
              type: object
              nullable: true
              properties:
                type: { $ref: '#/components/schemas/SubjectType' }
                nis: { type: string, nullable: true }
                nip: { type: string }
    AttendanceRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        subjectType: { $ref: '#/components/schemas/SubjectType' }
        subjectUserId: { type: string, format: uuid }
        subjectName: { type: string }
        classId: { type: string, format: uuid, nullable: true }
        attendanceDate: { type: string, format: date }
        checkInAt: { type: string, format: date-time, nullable: true }
        checkOutAt: { type: string, format: date-time, nullable: true }
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        source: { $ref: '#/components/schemas/AttendanceSource' }
        checkInDeviceId: { type: string, format: uuid, nullable: true }
        checkOutDeviceId: { type: string, format: uuid, nullable: true }
        lateMinutes: { type: integer, nullable: true }
    AttendanceRecordDetail:
      type: object
      properties:
        record: { $ref: '#/components/schemas/AttendanceRecord' }
        events:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              deviceId: { type: string, format: uuid }
              eventType: { $ref: '#/components/schemas/AttendanceEventType' }
              occurredAt: { type: string, format: date-time }
        corrections:
          type: array
          items: { $ref: '#/components/schemas/Correction' }
    Correction:
      type: object
      properties:
        id: { type: string, format: uuid }
        attendanceRecordId: { type: string, format: uuid }
        oldStatus: { $ref: '#/components/schemas/AttendanceStatus' }
        newStatus: { $ref: '#/components/schemas/AttendanceStatus' }
        status: { $ref: '#/components/schemas/CorrectionStatus' }
        requestedBy: { type: string, format: uuid }
        reviewedBy: { type: string, format: uuid, nullable: true }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        reviewedAt: { type: string, format: date-time, nullable: true }
    SchoolSettings:
      type: object
      properties:
        firstEntryTime: { type: string, example: '07:15' }
        timezone: { type: string, example: Asia/Jakarta }
        lateToleranceMinutes: { type: integer }
        updatedAt: { type: string, format: date-time }
    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        location: { type: string, nullable: true }
